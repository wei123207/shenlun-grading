# 申论AI评分系统 - Nginx 配置
# 将此文件放到服务器的 /etc/nginx/conf.d/shenlun.conf

server {
    listen 80;
    server_name your-domain.com;  # 替换为你的域名或IP

    # 前端静态文件
    root /var/www/shenlun-grading/dist;
    index index.html;

    # Vue Router history 模式支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 百度OCR 反向代理
    location /baidu-ocr/ {
        proxy_pass https://aip.baidubce.com/;
        proxy_set_header Host aip.baidubce.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    # 智谱清言AI 反向代理
    location /zhipu-ai/ {
        proxy_pass https://open.bigmodel.cn/;
        proxy_set_header Host open.bigmodel.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    # Supabase 反向代理
    location /supabase/ {
        proxy_pass https://hcjqxbknumjvkwzakgqj.supabase.co/;
        proxy_set_header Host hcjqxbknumjvkwzakgqj.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1000;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
