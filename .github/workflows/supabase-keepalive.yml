name: Supabase Keepalive

on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          # 在仓库 Settings → Secrets and variables → Actions 中配置以下 Secrets，不要硬编码
          SUPABASE_URL: ${{ secrets.SUPABASE_KEEPALIVE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL")
          echo "Supabase response status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Keepalive ping successful"
          else
            echo "Keepalive ping failed with status $STATUS"
            exit 1
          fi
